name: Build 1.21.4 Fabric bridge

on:
  push:
    branches:
      - pulse-vulkan-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload bridge jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smoothgl-pulse-vulkan-bridge-1.21.4
          path: build/libs/*.jar
