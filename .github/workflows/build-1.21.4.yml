name: Build bundled Pulse Vulkan 1.21.4

on:
  push:
    branches:
      - pulse-vulkan-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Verify VulkanMod is physically bundled
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          echo "Install JAR: $MAIN_JAR"
          ls -lh "$MAIN_JAR"
          jar tf "$MAIN_JAR" > /tmp/jar-contents.txt
          echo "Nested jars:"
          grep '^META-INF/jars/.*\.jar$' /tmp/jar-contents.txt
          grep -q '^META-INF/jars/.*\.jar$' /tmp/jar-contents.txt

      - name: Upload install jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smoothgl-pulse-vulkan-full-1.21.4
          path: |
            build/libs/*.jar
