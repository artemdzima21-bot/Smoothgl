plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Minecraft/VulkanMod provides the Vulkan LWJGL module at runtime. The Modrinth
    // dependency does not expose it transitively to our Java compiler, so keep this
    // compile-only: it must not create a second packaged LWJGL runtime.
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"

    // Exact official VulkanMod 0.5.4 build for Minecraft 1.21.4 / Fabric.
    // It is both a compile/runtime dependency and a Fabric Loom jar-in-jar dependency,
    // so the final installable JAR physically contains the complete VulkanMod runtime.
    def vulkanMod = "maven.modrinth:JYQhtZtO:${project.vulkanmod_version_id}"
    modImplementation vulkanMod
    include vulkanMod
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
